name: CI Tests

on:
  # The push run on main is what release-tag.yml checks before it tags a
  # commit: a squash merge makes a new commit that no pull request run tested.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Fleet-wide pin (matches luthersystems/ui-core); built with go1.26,
          # matching the go-version above.
          version: v2.13.2
          args: --timeout=5m ./...
          # `verify: true` fetches the JSON schema from golangci-lint.run on
          # every run, and a timeout there fails the job for a reason no PR can
          # fix (seen in luthersystems/elps). The next step runs the same
          # check offline: v2.13 embeds the schema in the binary.
          verify: false
      # `golangci-lint run` does NOT reject an unknown key in .golangci.yml (a
      # misspelled setting is silently ignored); only the schema check does.
      - name: golangci-lint config schema
        run: golangci-lint config verify
  build:
    name: build
    runs-on: ubuntu-latest
    needs: golangci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Run tests
        run: go test -v ./...
  # No govulncheck job here: the shared Security workflow
  # (.github/workflows/security.yml, from luthersystems/.github) runs the same
  # pinned govulncheck with go.mod's Go on every PR and push, and on a
  # schedule with a security-drift issue. See
  # https://github.com/luthersystems/.github/blob/main/docs/security-workflow.md
