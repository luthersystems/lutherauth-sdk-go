version: "2"
run:
  timeout: 5m
issues:
  # Report EVERY finding (same as luthersystems/elps). The defaults
  # (max-issues-per-linter: 50, max-same-issues: 3) silently collapse
  # repeats, so a plain run under-reports lint debt.
  max-issues-per-linter: 0
  max-same-issues: 0
linters:
  # Linter set copied from luthersystems/elps .golangci.yml.
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errchkjson
    - errorlint
    - exhaustive
    - forcetypeassert
    - gosec
    - intrange
    - makezero
    - nilerr
    - noctx
    - nolintlint
    - nonamedreturns
    - perfsprint
    - predeclared
    - revive
    - testifylint
    - unconvert
    - usestdlibvars
    - wastedassign
  settings:
    revive:
      rules:
        - name: function-result-limit
          arguments: [2]
        - name: argument-limit
          arguments: [4]
    exhaustive:
      # A switch with a `default:` has made an explicit decision about the
      # values it does not name, so it is not a silent fallthrough.
      default-signifies-exhaustive: true
    nonamedreturns:
      # A deferred closure that writes a named result is the one case where
      # result names change behaviour. Report it too.
      report-error-in-defer: true
    govet:
      enable:
        # shadow reports a `:=` that redeclares a name from an enclosing
        # scope, the shape that leaves an outer err or result unset.
        - shadow
      settings:
        shadow:
          # Report a shadow only when the outer variable is used after the
          # inner declaration.
          strict: false
    staticcheck:
      checks:
        - "all"
        - "-ST*"
  exclusions:
    rules:
      - linters:
          - revive
        path: '_test\.go'
